[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-engine"
version = "0.1.0"
description = "Triangle mesh preprocessing for AI Construction Inspector"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.3", "scipy==1.17.1"]

[project.optional-dependencies]
arkitscenes = ["Pillow==12.1.1", "matplotlib==3.10.8"]
server = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "supabase==2.33.0", "python-dotenv==1.2.4"]

[project.scripts]
geometry-engine = "geometry_engine.cli:main"

[tool.setuptools]
packages = ["geometry_engine", "geometry_engine_api", "geometry_engine_api.services"]
