name: Deploy Inspector web

on:
  push:
    branches: [feat/ai-inspector-development]
    paths:
      - ai_inspector/src/ai_inspector/web/**
      - ai_inspector/cloudflare/frontend/**
      - .github/workflows/deploy-inspector-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspector-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/ai-inspector-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai_inspector/cloudflare/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check index.js
          node --check ../../src/ai_inspector/web/app.js
      - name: Deploy existing web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
          npx --yes wrangler@4.154.0 deploy --config wrangler.jsonc
