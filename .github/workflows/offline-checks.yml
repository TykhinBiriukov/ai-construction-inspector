name: Offline regression checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned Inspector dependencies
        run: |
          python -m pip install -r ai_inspector/requirements.lock
          python -m pip install --no-deps ./ai_inspector
      - name: Inspector HTTP, storage and authorization regressions
        run: python -B -m unittest discover -s ai_inspector/tests -v
      - name: Browser viewer and gateway regressions
        run: node --test ai_inspector/tests/web/demo-comparison.test.cjs ai_inspector/cloudflare/frontend/index.test.mjs

  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Localization dependencies
        run: python -m pip install -r localization_service/requirements.txt
      - name: Localization contracts and numerical invariants
        run: python -B -m unittest discover -s localization_service/tests -v

  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Geometry core only
        run: python -m pip install ./geometry-engine
      - name: Camera projection, plane fitting and visibility invariants
        env:
          PYTHONPATH: geometry-engine
        run: |
          python -B -m unittest discover -s geometry-engine/tests -p test_projection_camera.py -v
          python -B -m unittest discover -s geometry-engine/tests -p test_plane_fitting.py -v
          python -B -m unittest discover -s geometry-engine/tests -p test_visibility.py -v
