<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction progress · 4D</title><link rel="stylesheet" href="viewer.css?v=20261103-layout2"></head>
<body><main>
<header><div><h1>Construction progress</h1></div></header>
<p id="status" role="status">Loading…</p>
<section class="viewer-panel">
<div class="view-toolbar"><label>Survey <select id="survey" aria-label="Survey date"></select></label><div><label>View <select id="view-mode" aria-label="View mode"><option value="surface">Survey</option><option value="combined">Design + survey</option><option value="project">Design</option></select></label> <label><input id="cutaway" type="checkbox" checked> Hide ceiling</label> <button id="reset-view">Reset view</button></div></div>
<div class="view"><canvas id="surface" aria-label="3D model for the selected week" hidden></canvas><canvas id="cloud" aria-label="3D viewport"></canvas><p id="empty">Select a survey</p><span class="view-hint">Drag to rotate · Scroll to zoom</span></div>
</section>
<div class="timeline-controls" id="week-navigation"><button id="play">▶ Play weeks</button><nav id="week-tabs" aria-label="Project weeks"></nav></div>
<p id="quality"></p><div id="selection-bar" hidden><span id="selection-label"></span><button id="clear-selection">All stages</button></div>
<section id="summary" class="summary" aria-label="Progress summary"></section>
<section><div class="section-heading"><h2>Progress by stage</h2><span>From photographs and observation history</span></div><div id="phase-cards" class="phase-grid"></div></section>
<section id="element-panel" hidden><h2 id="element-title"></h2><label>Show <select id="element-filter"><option value="all">All stage elements</option><option value="present">Observed now</option><option value="retained">Previously confirmed</option><option value="unknown">Unknown</option><option value="absent">Absent</option></select></label><div id="element-list"></div></section><p id="delay-summary"></p>
<section class="activity-panel"><h2>Weekly activity</h2><canvas id="activity" height="220" aria-label="Changes in installed element counts between surveys"></canvas><p id="activity-note"></p></section>
<details id="plan-details"><summary>Schedule, forecast and details</summary><p id="report-date"></p><table><thead><tr><th>Task</th><th>Planned completion</th><th>Observed now</th><th>Previously confirmed</th><th>Unknown</th><th>Forecast / scenario</th></tr></thead><tbody id="tasks"></tbody></table></details>


</main><script src="surface.bundle.js?v=20261103-layout2"></script><script src="viewer.js?v=20261103-layout2" defer></script></body></html>
